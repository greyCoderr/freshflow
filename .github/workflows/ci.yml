name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ALLOW_EMPTY_PASSWORD: "yes", MYSQL_DATABASE: freshflow }
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=5s --health-retries=20
    env:
      DATABASE_URL: mysql://root:@127.0.0.1:3306/freshflow
      TEST_DATABASE_URL: mysql://root:@127.0.0.1:3306/freshflow_test
      JWT_SECRET: ci-only-secret-ci-only-secret-0123456
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
